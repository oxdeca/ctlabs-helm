---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/certs-prod.yaml
# Description: prod-environment cert list, loaded as a second values file
#              ONLY by the cert-vault-sync-prod Application
#              (source.helm.valueFiles: [values.yaml, certs-prod.yaml]).
#              caBootstrap/letsencrypt/the k8s-auth reviewer stay off (their
#              values.yaml default) here - only issuers.yaml, loaded by the
#              base Application, turns them on.
# -----------------------------------------------------------------------------

certs:
  - cn: summer.ctlabs.internal
    san:
      - ip:127.0.0.1
    vault:
      mount: secrets/prod

  - cn: summertime.ctlabs.internal
    san:
      - ip:127.0.0.1
    vault:
      mount: secrets/prod
