---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/certs-prod.yaml
# Description: prod-environment overlay, loaded as a second values file ONLY
#              by the cert-vault-sync-prod Application
#              (source.helm.valueFiles: [values.yaml, certs-prod.yaml]).
#              Declares prod's secretstore instance and certificate list.
#              Issuers stay off (their values.yaml default) - only
#              issuers.yaml, loaded by the base Application, declares
#              issuer instances.
# -----------------------------------------------------------------------------

secretStores:
  prod:
    mount: secrets/prod

certificates:
  # cn is included as a dnsNames SAN automatically - see values.yaml.
  - cn: summer.ctlabs.internal
    store: prod
    san:
      - ip:127.0.0.1

  - cn: summertime.ctlabs.internal
    store: prod
    san:
      - ip:127.0.0.1
