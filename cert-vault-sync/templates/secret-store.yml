---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/templates/secret-store.yml
# -----------------------------------------------------------------------------

{{- if .Values.vault.kubernetesAuth.reviewer.enabled }}
# One-time Vault Kubernetes-auth reviewer identity: lets vdb1 validate the
# per-environment ServiceAccount tokens below via the K8s TokenReview API.
# Vault only ever reads this SA's token (auth/kubernetes/config
# token_reviewer_jwt) - it never authenticates AS this SA to do anything
# else, so no RBAC beyond system:auth-delegator is needed. Cluster-wide, not
# per-mount - keep reviewer.enabled: true on exactly one Application if this
# chart is ever split across several, or they'll fight over ownership of
# these three objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vault.kubernetesAuth.reviewer.serviceAccountName }}
  namespace: {{ .Values.vault.namespace | default "security-tools" }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.vault.kubernetesAuth.reviewer.serviceAccountName }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vault.kubernetesAuth.reviewer.serviceAccountName }}
    namespace: {{ .Values.vault.namespace | default "security-tools" }}

---

# Kubernetes stopped auto-minting a long-lived Secret for a ServiceAccount's
# token as of 1.24 (default is now short-lived, projected-volume only) -
# Vault needs a durable token to call TokenReview on an ongoing basis, so
# this Secret is requested explicitly via the legacy
# kubernetes.io/service-account-token annotation mechanism.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vault.kubernetesAuth.reviewer.serviceAccountName }}-token
  namespace: {{ .Values.vault.namespace | default "security-tools" }}
  annotations:
    kubernetes.io/service-account.name: {{ .Values.vault.kubernetesAuth.reviewer.serviceAccountName }}
type: kubernetes.io/service-account-token
{{- end }}

{{- if .Values.vault.ca.enabled }}
---
# The CA that signed vdb1's own TLS serving cert, as a ConfigMap instead of
# inline base64 in every ClusterSecretStore below (see values.yaml). One
# object, referenced by name+namespace from every mount's store regardless
# of which Application actually created it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.vault.ca.configMapName }}
  namespace: {{ .Values.vault.namespace | default "security-tools" }}
data:
  ca.crt: |
{{ .Values.vault.ca.pem | indent 4 }}
{{- end }}

{{/* Collect unique vault mounts across all configured certs (defaults-merged) */}}
{{- $mounts := dict -}}
{{- range .Values.certs -}}
  {{- $merged := mergeOverwrite (deepCopy $.Values.defaults) . -}}
  {{- $mount := $merged.vault.mount | default "secret" -}}
  {{- $_ := set $mounts $mount true -}}
{{- end -}}

{{/* One ServiceAccount + ClusterSecretStore per distinct mount point - each
     environment authenticates to Vault as its own ServiceAccount (name
     doubles as the Vault role name, see roles/ctlabs_vault's kubernetes
     setup fact in ctlabs-ansible), validated via Vault's kubernetes auth.
     No stored Vault credential, nothing to rotate. */}}
{{- range $mount, $_ := $mounts }}
{{- $env := base $mount }}
{{- $name := printf "cert-vault-sync-%s" $env }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.vault.namespace | default "security-tools" }}

---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ include "cert-vault-sync.storeName" $mount }}
spec:
  provider:
    vault:
      server: {{ $.Values.vault.server | quote }}
      path: {{ $mount | quote }}
      version: v2
      caProvider:
        type: ConfigMap
        name: {{ $.Values.vault.ca.configMapName }}
        namespace: {{ $.Values.vault.namespace | default "security-tools" }}
        key: ca.crt
      auth:
        kubernetes:
          mountPath: {{ $.Values.vault.kubernetesAuth.mountPath | quote }}
          role: {{ $name | quote }}
          serviceAccountRef:
            name: {{ $name }}
            namespace: {{ $.Values.vault.namespace | default "security-tools" }}
{{- end }}
