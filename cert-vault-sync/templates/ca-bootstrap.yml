---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/templates/ca-bootstrap.yml
# -----------------------------------------------------------------------------

{{- if .Values.caBootstrap.enabled }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cert-vault-sync-selfsigned
spec:
  selfSigned: {}

---

apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: cert-vault-sync-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: cert-vault-sync-ca
  secretName: {{ .Values.caBootstrap.caSecretName }}
  issuerRef:
    name: cert-vault-sync-selfsigned
    kind: ClusterIssuer
  duration: {{ .Values.caBootstrap.duration }}

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.caBootstrap.issuerName }}
spec:
  ca:
    secretName: {{ .Values.caBootstrap.caSecretName }}
{{- end }}
