---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/templates/push-secret.yml
# -----------------------------------------------------------------------------

{{- range $cert := .Values.certs }}
---
{{- $merged := mergeOverwrite (deepCopy $.Values.defaults) $cert -}}
{{- $slug := include "cert-vault-sync.slug" $merged.cn -}}
{{- $mount := $merged.vault.mount | default "secret" -}}
{{- $storeName := include "cert-vault-sync.storeName" $mount -}}
{{- $remoteKey := include "cert-vault-sync.reverseDomain" $merged.cn }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-{{ $slug }}-to-vault
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $merged.refreshInterval | default "1h" }}
  updatePolicy: Replace
  secretStoreRefs:
    - name: {{ $storeName }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $slug }}-tls
  data:
    - conversionStrategy: None
      match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: tls.crt
    - conversionStrategy: None
      match:
        secretKey: tls.key
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: tls.key
    {{- if ne $merged.vault.includeCaCert false }}
    - conversionStrategy: None
      match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: ca.crt
    {{- end }}
{{- end }}
