---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/templates/sync/push-secrets.yml
# The sync edge: pushes each certificate's k8s Secret into its secretstore -
# one PushSecret per certificate, the *---1 side of the object model made
# concrete (hence its own directory: it connects two classes rather than
# belonging to either).
# -----------------------------------------------------------------------------

{{- range $cert := .Values.certificates }}
---
{{- $merged := mergeOverwrite (deepCopy $.Values.defaults) $cert }}
{{- $link := mergeOverwrite (deepCopy $.Values.sync) (default (dict) $cert.sync) }}
{{- $slug := include "cert-vault-sync.slug" $merged.cn }}
{{- $sref := default "" $merged.store }}
{{- $store := index $.Values.secretStores $sref }}
{{- if not $sref }}
{{-   fail (printf "certificates entry cn=%q: missing required store: ref (declare the target under secretStores)" $merged.cn) }}
{{- else if not $store }}
{{-   fail (printf "certificates entry cn=%q: store %q is not declared under secretStores" $merged.cn $sref) }}
{{- else if not (hasKey $store "mount") }}
{{-   fail (printf "certificates entry cn=%q: store %q is not a store instance (secretStores.vault is the connection, not a store)" $merged.cn $sref) }}
{{- end }}
{{- $mount := $store.mount }}
{{- $storeName := include "cert-vault-sync.storeName" $mount }}
{{- $remoteKey := include "cert-vault-sync.reverseDomain" $merged.cn }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: push-{{ $slug }}-to-vault
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: {{ $link.refreshInterval | default "1h" }}
  updatePolicy: Replace
  secretStoreRefs:
    - name: {{ $storeName }}
      kind: ClusterSecretStore
  selector:
    secret:
      name: {{ $slug }}-tls
  data:
    - conversionStrategy: None
      match:
        secretKey: tls.crt
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: tls.crt
    - conversionStrategy: None
      match:
        secretKey: tls.key
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: tls.key
    {{- if ne $link.includeCaCert false }}
    - conversionStrategy: None
      match:
        secretKey: ca.crt
        remoteRef:
          remoteKey: {{ $remoteKey | quote }}
          property: ca.crt
    {{- end }}
{{- end }}
