---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/values.yaml
# -----------------------------------------------------------------------------
#
# Helm's implicit base layer - loaded first by EVERY cert-vault-sync
# Application, regardless of what else is in source.helm.valueFiles. The
# chart's object model:
#
#     issuer |1---*| certificate |*---1| secretstore
#
# with PushSecret (templates/sync/) as the certificate<->secretstore sync
# edge, and the private-PKI issuer entry (issuers[].privateCA) as the thing
# that PRODUCES the internal-ca issuer.
#
# Namespace rule: a class key holds its INSTANCES directly - no items/
# wrapper layer. Shared config sits where it is named (secretStores.vault =
# the connection every store shares) or under the top-level defaults: key
# (Certificate defaults - the only homogeneous collection; issuer entries
# are self-contained, they have no shared defaults).
#
#   secretStores:  vault: connection + named instances (mount: ...) in overlays
#   issuers:       ACME / private-PKI issuer list (base app only)
#   defaults:      Certificate defaults (this class's shared attributes)
#   certificates:  Certificate instances (per-env lists)
#   sync:          PushSecret link config (the edge's own attributes)
#
# Everything here is inert. Instances live only in each Application's own
# overlay file (loaded second):
#   - issuers.yaml         (base app)   - issuers (cluster-wide, base-owned)
#   - certs-dev/uat/prod   (env apps)   - that env's secretStores instances
#                                        + certificates list
# Wired in the ctlabs repo's setup_profiles.yml
# (argoapp.applications[].source.helm.valueFiles). Those filenames and the
# app<->resource ownership mapping are a CONTRACT with that wiring - renaming
# them needs a ctlabs playbook run; changing this file's internals does not.
# -----------------------------------------------------------------------------

secretStores:
  # Vault IS the secret store (provider=vault): address, auth and TLS trust
  # are attributes of every store instance, configured once here. The key
  # `vault` is the connection itself (no mount: key); every OTHER entry is
  # a store instance and must carry a mount:. Instances are declared only
  # in each env's certs-<env>.yaml - the base app must declare none, or it
  # would render stores it doesn't own and fight the env apps over ArgoCD's
  # live resource-ownership labels.
  vault:
    server: "https://vdb1.ctlabs.internal:8200"
    namespace: security-tools
    # Each store instance authenticates to Vault's jwt auth method as its own
    # ServiceAccount (one created per instance in templates/secretstores/
    # stores.yml; the SA name doubles as the Vault role name, see the
    # roles/ctlabs_vault jwt setup fact in ctlabs-ansible). Vault validates
    # each short-lived SA token LOCALLY against the cluster's SA signing key
    # (jwt_validation_pubkeys) - no TokenReview, so no long-lived reviewer
    # JWT and nothing stored on the Vault side. path must match the fact's
    # ctlabs_vault_setup.jwt[].mount on the vdb1 side.
    jwtAuth:
      path: jwt
    # TLS trust for Vault's SERVING certificate (not the k8s-auth CA above -
    # that one validates ServiceAccount tokens, this one validates Vault's
    # server certificate). Reference only: the ConfigMap is deliberately NOT
    # chart material. The lab CA under /etc/ca-ctlabs/ is regenerated on
    # every lab up, so the PEM that used to live here (vault.ca.pem) went
    # stale each rebuild - same rule as the Cloudflare token Secret in
    # issuers.yaml: environment material is created out-of-band (lab
    # pipeline: kubectl create configmap from /etc/ca-ctlabs/ca-ctlabs.crt)
    # and referenced by name+key only.
    ca:
      configMapName: ca-ctlabs-crt
      key: ca.crt
  # Instances are sibling entries of `vault:` above, keyed by the name
  # certificates reference, e.g.:
  #   uat: {mount: secrets/uat}
  # Each renders one ServiceAccount + ClusterSecretStore. Declared ONLY in
  # the env overlays - see the vault: comment.

# Issuer instances - owned SOLELY by the base Application (issuers.yaml);
# empty here so no other Application can render one. A bare list, no
# shared defaults: entries are self-contained and heterogeneous (an ACME
# entry and a privateCA entry share nothing but name/enabled), each is
# either   {name, enabled?, acme: {...}}  or  {name, enabled?, privateCA: {...}}.
# enabled defaults to true (presence = render); an entry with neither
# acme: nor privateCA: fails the render rather than producing nothing.
issuers: []

# -----------------------------------------------------------------------------
# defaults: Certificate defaults - the shared attributes of the certificate
# class (issuer ref, key policy, lifetime/renewal math). Any key can be
# overridden on an individual entry under certificates: (deep-merged on top
# of this block), so a cert only specifies what differs. Store refs and
# PushSecret/link settings are NOT here: they belong to their own classes.
# -----------------------------------------------------------------------------
defaults:
  # The certificate references an issuer instance by NAME only - all
  # issuer config (ACME server/email/solvers, CA chain/duration) lives
  # in issuers.yaml, never here. kind is not a cert-side value: this
  # chart only ever renders ClusterIssuers (both variants), so the
  # template emits kind: ClusterIssuer itself. The name is checked
  # against issuers on the check-only superset render (see
  # templates/certificates/certificates.yml).
  issuer:
    name: ctlabs-k8s-ca   # override per-cert, e.g. {name: lecf-oa-prod}, for a real public domain
  privateKey:
    algorithm: RSA   # RSA | ECDSA | Ed25519 (cert-manager spec.privateKey.algorithm)
    size: 4096       # RSA: 2048/3072/4096/8192, ECDSA: 256/384/521, ignored for Ed25519
    rotationPolicy: Always   # Always | Never - rotate the key on every renewal. Pinned
                             # explicitly (cert-manager >= v1.18 already defaults to Always)
                             # so intent survives downgrades / feature-gate changes.
  # duration (spec.duration): REQUESTED lifetime. Fully honored by our own
  # internal CA, but for ACME issuers (Let's Encrypt) it's only a hint the
  # issuer may ignore - LE currently issues 90d regardless of what's asked.
  #duration: 2160h   # 90d, Go duration units only (h/m/s - no "d" suffix)
  duration: 1h
  # renewBeforePercentage, NOT a fixed renewBefore: renew at this % of
  # whatever lifetime the issuer ACTUALLY returned (not the requested
  # duration above) - stays correct automatically as public CAs keep
  # shrinking max validity (CA/Browser Forum glide path: 398d today -> 200d
  # (2026) -> 100d (2027) -> 47d (2029)), with no absolute number to go
  # stale. Mutually exclusive with renewBefore - override per-cert with an
  # absolute renewBefore instead if ever needed (and set
  # renewBeforePercentage: null on that cert to drop this default).
  renewBeforePercentage: 10
  # Renewal spread - RENEWALS ONLY. This never delays initial issuance (all
  # Certificates are created at once; first issuance is immediate and gets
  # planned separately against the CA's issuance quota) and never delays a
  # reissue (identifier change -> immediate, emergency only). Without the
  # spread, every cert issued around the same time shares the same
  # renewBeforePercentage of the same duration, so they all cross their
  # renewal threshold on the same instant - a thundering herd of
  # simultaneous renewals/ACME/DNS-01 calls. This adds a 0..N percentage-
  # point offset per cert, assigned by the cert's POSITION in this
  # environment's certs list: first cert = base, last cert = base+spread,
  # evenly spaced in between. Positional, NOT a cn-hash: a hash clusters on
  # structured names (some buckets empty, others piled up); list position is
  # even by construction whatever the names look like. Small is fine: LE
  # exempts same-identifier renewals from the 50/registered-domain/7d quota
  # (global across accounts; only 5/exact-set/7d applies - never approached
  # at a 45d+ cycle), so the spread only sizes the load on the ACME per-IP
  # burst limit and the DNS-01 provider API: busiest renewal week is about
  # N*7/(spread*0.9*actual lifetime) certs (45d lifetime, spread 5 -> all
  # renewals evenly over ~2.3d, i.e. ~44/day at N=100). The base
  # renewBeforePercentage is the recovery budget once a renewal triggers:
  # 10 -> 4.5d margin at 45d validity, 9d at 90d (cert-manager retries
  # exponentially, capped at 32h per attempt; 5 minutes is the enforced
  # floor, which is what the 1h test certs get). 0 = disabled (all certs
  # keep the exact base percentage above); set per-cert to 0 to pin that
  # cert to the base. Only applies to certs using renewBeforePercentage -
  # no effect on a per-cert absolute renewBefore override.
  renewBeforePercentageSpread: 5

# Certificate instances. cn is automatically included as a dnsNames SAN -
# no need to repeat it in san: (skipped only if san: already lists that
# exact name). A wildcard entry like *.example.com does NOT imply
# example.com itself.
#
# Empty here - each environment's Application supplies its list via its own
# overlay (certs-dev/certs-uat/certs-prod), which REPLACES this list
# wholesale (Helm replaces list-valued keys across -f files, no merge).
# Every entry needs store: (no default - an env-specific mount in the
# shared base was a footgun: uat certs silently inherited it) and inherits
# issuer: from defaults above unless overridden.
certificates: []

# PushSecret - the sync edge between a certificate's k8s Secret and its
# store, one per certificate (templates/sync/push-secrets.yml). The edge has
# its own attributes; link-wide config here, per-cert override via
# certificates[].sync: {refreshInterval, includeCaCert}.
sync:
  refreshInterval: 1m
  includeCaCert: true   # ACME-issued certs (e.g. Let's Encrypt) have no separate ca.crt key - set false per-cert
