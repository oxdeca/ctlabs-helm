---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/certs-dev.yaml
# Description: dev-environment overlay, loaded as a second values file ONLY
#              by the cert-vault-sync-dev Application
#              (source.helm.valueFiles: [values.yaml, certs-dev.yaml]).
#              Declares the two things that Application owns: dev's
#              secretstore instance(s) and its certificate list. Issuers
#              stay off (their values.yaml default) - only issuers.yaml,
#              loaded by the base Application, declares issuer instances.
# -----------------------------------------------------------------------------

secretStores:
  dev:
    mount: secrets/dev

certificates:
  - cn: winter.ctlabs.internal
    store: dev
    san:
      - ip:127.0.0.1

  - cn: winterland.ctlabs.internal
    store: dev
    san:
      - ip:127.0.0.1
