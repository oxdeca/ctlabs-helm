---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/issuers.yaml
# Description: override for the cert-vault-sync (base) Application
#              (source.helm.valueFiles: [values.yaml, issuers.yaml]). The
#              ONLY Application that declares issuer instances - the
#              cluster-wide singletons every certificate relies on but only
#              ONE Application may own. No secretStores instances and no
#              certificates here: stores and certificates belong to the
#              per-environment Applications (certs-dev/uat/prod.yaml),
#              never to this one.
#
#              Two issuer variants, one schema (values.yaml issuers):
#                privateCA - internal CA; the chart bootstraps the whole
#                            chain (self-signed root -> CA cert -> this
#                            issuer), so a fresh lab gets a fresh PKI with
#                            nothing to import.
#                acme      - ACME (Cloudflare DNS-01) for real public
#                            domains; the internal CA above is for
#                            *.ctlabs.internal, which isn't a public domain
#                            LE can validate.
#
#              Cluster-wide singletons ONLY - nothing else belongs here:
#              no secretStores instances (those live in each env's
#              certs-<env>.yaml), no certificates, and no Vault connection
#              config (that is values.yaml, shared by every Application).
#              The Vault TLS CA ConfigMap is also NOT here - it is out-of-band
#              lab material (see values.yaml secretStores.vault.ca).
# -----------------------------------------------------------------------------
issuers:
  - name: ctlabs-internal-ca
    privateCA:
      secretName: cert-vault-sync-ca-secret   # key/cert Secret the CA issuer reads (namespace: cert-manager)
      duration: 8760h                          # root CA lifetime (Go duration units)

  # -----------------------------------------------------------------------------
  # ACME entries: the Cloudflare API token is NEVER a chart value - only a
  # Secret name/key are referenced. Create the Secret out-of-band, in the
  # `cert-manager` namespace (ClusterIssuer secretRefs always resolve
  # against cert-manager's cluster-resource-namespace, same as the private
  # CA secret above):
  #   kubectl -n cert-manager create secret generic <name> \
  #     --from-literal=api-token=<token>
  # enabled: false keeps the entry defined but unrendered (staging /
  # not-yet-live toggles).
  # -----------------------------------------------------------------------------
  - name: letsencrypt-cf-staging
    enabled: false
    acme:
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      email: "cloudflare@oxdeca.com"
      cloudflare:
        secretRef:
          name: cloudflare-staging-api-token

  - name: lecf-oa-prod
    enabled: false
    acme:
      server: https://acme-v02.api.letsencrypt.org/directory
      email: wschaefer@oanda.com
      cloudflare:
        secretRef:
          name: lecf-oa-prod-api-token
