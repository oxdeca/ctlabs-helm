---

# -----------------------------------------------------------------------------
# File: cert-vault-sync/issuers.yaml
# Description: override for the cert-vault-sync (base) Application
#              (source.helm.valueFiles: [values.yaml, issuers.yaml]). Turns
#              on the cluster-wide singletons that every certificate relies
#              on but only ONE Application may own: the internal CA chain,
#              the Let's Encrypt ClusterIssuers, and the Vault k8s-auth
#              reviewer identity. No certs: here - every certificate belongs
#              to exactly one per-environment Application (certs-dev.yaml/
#              certs-uat.yaml/certs-prod.yaml), never to this one.
# -----------------------------------------------------------------------------

caBootstrap:
  enabled: true
  issuerName: ctlabs-internal-ca
  caSecretName: cert-vault-sync-ca-secret
  duration: 8760h

# -----------------------------------------------------------------------------
# letsencrypt: ACME ClusterIssuer(s) using a Cloudflare DNS-01 solver, for
# certs on a real public domain delegated to Cloudflare (the internal CA
# above is for *.ctlabs.internal, which isn't a public domain LE can
# validate). issuers: is a list - add as many as needed (e.g. separate
# Cloudflare accounts/zones).
#
# The Cloudflare API token is NEVER a chart value - only a Secret name/key
# are referenced here. Create the Secret out-of-band, in the `cert-manager`
# namespace (ClusterIssuer secretRefs always resolve against cert-manager's
# cluster-resource-namespace, same as caBootstrap's own CA secret above):
#   kubectl -n cert-manager create secret generic <name> \
#     --from-literal=api-token=<token>
# -----------------------------------------------------------------------------
letsencrypt:
  issuers:
    - issuerName: letsencrypt-cf-staging
      enabled: false
      server: https://acme-staging-v02.api.letsencrypt.org/directory
      email: "cloudflare@oxdeca.com"
      cloudflare:
        secretRef:
          name: cloudflare-staging-api-token

    - issuerName: lecf-oa-prod
      enabled: false
      server: https://acme-v02.api.letsencrypt.org/directory
      email: wschaefer@oanda.com
      cloudflare:
        secretRef:
          name: lecf-oa-prod-api-token

    # Second issuer, e.g. another zone/account - give it its own issuerName,
    # email/zone as needed, and its own Secret so tokens never mix:
    # - enabled: true
    #   issuerName: letsencrypt-cf-prod
    #   server: https://acme-v02.api.letsencrypt.org/directory
    #   email: "cloudflare@oxdeca.com"
    #   cloudflare:
    #     secretRef:
    #       name: cloudflare-prod-api-token

